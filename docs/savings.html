<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>적금·복리 계산기</title><meta name="description" content="월 납입액과 연 이율, 기간으로 만기 금액과 이자를 계산합니다."><style>:root{--bg:#fff;--fg:#1c2230;--mut:#5b6475;--card:#f4f6fa;--ac:#1a56db;--bd:#d9dee8}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ebf2;--mut:#a3adc2;--card:#1b2030;--ac:#7ba5ff;--bd:#2c3347}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,'Malgun Gothic',sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.5rem;margin:.4em 0}h2{font-size:1.15rem;margin-top:2em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
label{display:block;margin:.6em 0 .2em;font-weight:600}input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px}
button{margin-top:14px;padding:12px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.res{font-size:1.1rem;margin-top:14px}.res b{color:var(--ac)}table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:right}
a{color:var(--ac)}nav a{margin-right:14px}.note{color:var(--mut);font-size:.9rem}footer{margin-top:40px;color:var(--mut);font-size:.85rem}</style></head><body><main><nav><a href="index.html">계산기 목록</a><a href="loan.html">대출 이자</a><a href="savings.html">적금·복리</a><a href="severance.html">퇴직금</a><a href="hourly.html">시급 월급 환산</a><a href="lotto.html">로또 확률</a></nav>
<h1>적금·복리 계산기</h1><p class="note">월 납입액과 연 이율, 기간으로 만기 금액과 이자를 계산합니다.</p><div class="card"><label>월 납입액 (원)</label><input id="a" type="number" value="500000"><label>연 이율 (%)</label><input id="r" type="number" step="0.01" value="3.5">
<label>기간 (개월)</label><input id="n" type="number" value="36"><label>이자 방식</label><select id="m"><option value="s">단리 (일반 적금)</option><option value="c">월복리</option></select>
<button onclick="go()">계산하기</button><div class="res" id="o"></div></div><h2>단리와 복리는 어떻게 다른가요?</h2><p>단리는 원금에만 이자가 붙고, 복리는 이자에도 이자가 붙습니다. 일반 적금은 단리가 많습니다.</p><h2>세금은 얼마인가요?</h2><p>일반 과세 이자소득세는 15.4%(소득세 14% + 지방소득세 1.4%)입니다. 비과세·세금우대 상품은 다를 수 있습니다.</p>
<footer>입력한 값은 이 기기 안에서만 계산되며 서버로 전송되지 않습니다. 결과는 참고용이며 법적·금융 효력이 없습니다.</footer></main><script>const f=n=>Math.round(n).toLocaleString('ko-KR');function go(){const A=+a.value,R=+r.value/100,N=+n.value;let fv,pr=A*N;
if(m.value==='s'){fv=pr+A*R/12*N*(N+1)/2}else{const i=R/12;fv=i?A*((Math.pow(1+i,N)-1)/i)*(1+i):pr}
o.innerHTML='원금 <b>'+f(pr)+'원</b><br>세전 이자 <b>'+f(fv-pr)+'원</b><br>세전 만기 금액 <b>'+f(fv)+'원</b><br><span class="note">일반 이자소득세 15.4%를 빼면 세후 이자는 약 '+f((fv-pr)*0.846)+'원입니다.</span>'}go()</script></body></html>
